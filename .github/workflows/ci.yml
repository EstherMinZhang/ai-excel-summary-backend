name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: ai-summary-deployment
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_PAGER: ""
      S3_BUCKET: elasticbeanstalk-us-east-2-356065270051
      EB_APPLICATION: ai-summary
      EB_ENVIRONMENT: ai-summary-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Package application
        run: zip -r deployment.zip Dockerfile requirements.txt app -x "*/__pycache__/*" "*.pyc" "*/.env"

      - name: Set deployment version
        run: |
          VERSION="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "S3_KEY=ai-summary/${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deployment.zip "s3://${S3_BUCKET}/${S3_KEY}"

      - name: Check deployment package ACL access
        run: |
          aws s3api get-object-acl \
            --bucket "$S3_BUCKET" \
            --key "$S3_KEY"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --source-bundle "S3Bucket=${S3_BUCKET},S3Key=${S3_KEY}"

      - name: Start deployment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"

      - name: Verify deployed version
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].{Status:Status,Health:Health,Version:VersionLabel}" \
            --output table

          DEPLOYED_VERSION=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].VersionLabel" \
            --output text)

          echo "Expected version: $VERSION"
          echo "Actual version:   $DEPLOYED_VERSION"

          if [ "$DEPLOYED_VERSION" != "$VERSION" ]; then
            echo "::error::The expected application version is not running."
            exit 1
          fi

      - name: Show recent Elastic Beanstalk events
        if: always()
        run: |
          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-records 30 \
            --no-paginate \
            --query "Events[*].[EventDate,Severity,Message]" \
            --output table